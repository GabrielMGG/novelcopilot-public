spring.application.name=backend

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# Banco de dados
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Supabase
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}

# Origem autorizada no CORS. Em deploy, configure a URL publica exata do frontend.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Segurança administrativa
novelcopilot.security.admin-user-ids=${ADMIN_USER_IDS:}

# Gemini
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-3.5-flash

# Provedor padrão
ai.provider=${AI_PROVIDER:cloudflare}

# Groq
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Cloudflare Workers AI
ai.providers.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
ai.providers.cloudflare.auth-token=${CLOUDFLARE_AUTH_TOKEN:}
ai.providers.cloudflare.model=${CLOUDFLARE_MODEL:@cf/google/gemma-4-26b-a4b-it}
ai.providers.cloudflare.summary-account-id=${CLOUDFLARE_SUMMARY_ACCOUNT_ID:}
ai.providers.cloudflare.summary-auth-token=${CLOUDFLARE_SUMMARY_AUTH_TOKEN:}
ai.providers.cloudflare.base-url=https://api.cloudflare.com/client/v4/accounts

# Benchmark
ai.benchmark.enabled=${AI_BENCHMARK_ENABLED:false}

