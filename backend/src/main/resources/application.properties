# NovelCopilot AI Producao
novelcopilot.ai.enabled=true
novelcopilot.ai.provider=${AI_PROVIDER:cloudflare}
novelcopilot.ai.primary-model=${AI_PRIMARY_MODEL:@cf/google/gemma-4-26b-a4b-it}
novelcopilot.ai.fallback-model=qwen/qwen3-235b-a22b-2507
novelcopilot.ai.fallback-enabled=false
novelcopilot.ai.timeout=60000
novelcopilot.ai.default-temperature=0.7
novelcopilot.ai.max-output-tokens=2048
novelcopilot.ai.max-context-tokens=60000
novelcopilot.ai.max-retries=1
novelcopilot.ai.max-instruction-length=1000
novelcopilot.ai.max-characters-included=10
novelcopilot.ai.max-world-notes-included=10
novelcopilot.ai.max-previous-chapters-included=3
novelcopilot.ai.summary.provider=${AI_SUMMARY_PROVIDER:cloudflare}
novelcopilot.ai.summary.model=${AI_SUMMARY_MODEL:@cf/google/gemma-4-26b-a4b-it}
novelcopilot.ai.summary.max-output-tokens=${AI_SUMMARY_MAX_OUTPUT_TOKENS:1400}

# Cotas locais para limitar e acompanhar o uso da IA.
novelcopilot.credits.development-credits-enabled=${AI_DEVELOPMENT_CREDITS_ENABLED:false}
novelcopilot.credits.development-quota-profile-code=${AI_DEVELOPMENT_QUOTA_PROFILE:DEMO}
novelcopilot.credits.minimum-charge-credits=${AI_MINIMUM_CHARGE_CREDITS:1}
novelcopilot.credits.selection-edit-minimum-charge-credits=${AI_SELECTION_EDIT_MINIMUM_CHARGE_CREDITS:${AI_REWRITE_MINIMUM_CHARGE_CREDITS:0.10}}
novelcopilot.credits.selection-edit-increment-credits=${AI_SELECTION_EDIT_INCREMENT_CREDITS:0.10}
novelcopilot.credits.maximum-credits-per-generation=${AI_MAXIMUM_CREDITS_PER_GENERATION:10}

# Limites persistentes por usuário para chamadas pagas de IA
novelcopilot.ai.rate-limit.enabled=${AI_RATE_LIMIT_ENABLED:true}
novelcopilot.ai.rate-limit.general-limit=${AI_RATE_LIMIT_GENERAL_LIMIT:10}
novelcopilot.ai.rate-limit.general-window-seconds=${AI_RATE_LIMIT_GENERAL_WINDOW_SECONDS:60}
novelcopilot.ai.rate-limit.expensive-limit=${AI_RATE_LIMIT_EXPENSIVE_LIMIT:3}
novelcopilot.ai.rate-limit.expensive-window-seconds=${AI_RATE_LIMIT_EXPENSIVE_WINDOW_SECONDS:300}
novelcopilot.ai.rate-limit.benchmark-run-limit=${AI_RATE_LIMIT_BENCHMARK_RUN_LIMIT:1}
novelcopilot.ai.rate-limit.benchmark-run-window-seconds=${AI_RATE_LIMIT_BENCHMARK_RUN_WINDOW_SECONDS:3600}
novelcopilot.ai.rate-limit.benchmark-retry-limit=${AI_RATE_LIMIT_BENCHMARK_RETRY_LIMIT:2}
novelcopilot.ai.rate-limit.benchmark-retry-window-seconds=${AI_RATE_LIMIT_BENCHMARK_RETRY_WINDOW_SECONDS:3600}

