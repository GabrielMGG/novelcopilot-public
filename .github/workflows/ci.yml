name: Validacao do projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testar backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend - Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Preparar Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Testar frontend
        working-directory: frontend
        run: npm run test:ci

      - name: Verificar lint
        working-directory: frontend
        run: npm run lint

      - name: Gerar build de producao
        working-directory: frontend
        run: npm run build
